<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosto SVG — demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 14%, rgba(247, 197, 0, 0.18), transparent 44%),
          radial-gradient(circle at 84% 84%, rgba(85, 37, 131, 0.08), transparent 48%),
          #f3f1ed;
        color: #171a21;
        padding: 32px 20px;
      }

      #app {
        width: min(560px, 100%);
        display: grid;
        justify-items: center;
        gap: 22px;
      }

      header {
        text-align: center;
        display: grid;
        gap: 6px;
        justify-items: center;
      }

      .eyebrow {
        margin: 0;
        color: #9a6d16;
        font-size: 0.68rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 620;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0;
        color: #6a7280;
        font-size: 0.82rem;
      }

      #face-stage {
        width: min(430px, 84vw);
        padding: 18px 18px 0;
        border-radius: 32px;
        background:
          radial-gradient(circle at 38% 18%, #fffdf8, transparent 58%),
          linear-gradient(160deg, #fbfaf6, #efede7 68%, #e5e2db);
        box-shadow:
          0 40px 90px rgba(66, 48, 22, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        overflow: hidden;
      }

      #face {
        filter: drop-shadow(0 26px 34px rgba(80, 50, 20, 0.18));
      }

      .hint {
        margin: 0;
        color: #8a8378;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
      }

      .audio-gate {
        padding: 10px 18px;
        border: 1px solid rgba(154, 109, 22, 0.4);
        border-radius: 999px;
        background: linear-gradient(180deg, #fff6d8, #f6e3a8);
        color: #6b4d0d;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 620;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(154, 109, 22, 0.18);
      }

      .audio-gate:hover {
        background: linear-gradient(180deg, #fff9e6, #f9e9b8);
      }

      .speech {
        width: 100%;
        display: grid;
        gap: 10px;
        padding: 14px;
        border: 1px solid rgba(90, 72, 38, 0.14);
        border-radius: 18px;
        background: rgba(255, 254, 250, 0.92);
        box-shadow: 0 18px 40px rgba(66, 48, 22, 0.08);
      }

      .speech-field {
        display: grid;
        gap: 4px;
      }

      .speech-field > span {
        color: #8a6410;
        font-size: 0.6rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .speech textarea {
        width: 100%;
        min-height: 62px;
        resize: vertical;
        padding: 9px 10px;
        border: 1px solid rgba(90, 72, 38, 0.18);
        border-radius: 10px;
        background: #fffdf8;
        color: #2b2620;
        font: inherit;
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .speech textarea:focus,
      .speech select:focus {
        outline: 2px solid rgba(154, 109, 22, 0.32);
        outline-offset: 1px;
      }

      .speech-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .speech-field--inline {
        flex: 1;
      }

      .speech select {
        width: 100%;
        padding: 8px 9px;
        border: 1px solid rgba(90, 72, 38, 0.18);
        border-radius: 10px;
        background: #fffdf8;
        color: #45381f;
        font: inherit;
        font-size: 0.78rem;
      }

      .speech-row button {
        padding: 9px 14px;
        border: 1px solid rgba(90, 72, 38, 0.22);
        border-radius: 10px;
        background: #fbf7ec;
        color: #45381f;
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }

      .speech-row button[data-speak] {
        border-color: #d9ac00;
        background: #f7c500;
        color: #3a2c00;
        font-weight: 620;
      }

      .speech-row button:hover {
        filter: brightness(0.97);
      }

      .speech-status {
        margin: 0;
        min-height: 1.2em;
        color: #6d6558;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.66rem;
      }

      .speech-status[data-state='speaking'] {
        color: #8a6410;
      }

      .speech-status[data-state='error'] {
        color: #a33a2a;
      }

      body.debug-open {
        padding-right: 370px;
      }

      #debug-panel {
        position: fixed;
        top: 14px;
        right: 14px;
        bottom: 14px;
        width: 330px;
        overflow-y: auto;
        padding: 16px;
        border: 1px solid rgba(90, 72, 38, 0.18);
        border-radius: 18px;
        background: rgba(255, 254, 250, 0.97);
        box-shadow: 0 24px 60px rgba(46, 34, 18, 0.18);
        backdrop-filter: blur(12px);
        font-size: 0.8rem;
        scrollbar-width: thin;
      }

      .debug-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(90, 72, 38, 0.14);
      }

      .debug-header h2 {
        margin: 2px 0 0;
        font-size: 1rem;
        letter-spacing: -0.01em;
      }

      .debug-eyebrow {
        margin: 0;
        color: #9a6d16;
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .debug-stats {
        margin: 0;
        padding-top: 4px;
        color: #6d6558;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.64rem;
        white-space: nowrap;
      }

      .debug-actions {
        display: flex;
        gap: 8px;
        padding: 10px 0 4px;
      }

      .debug-actions button {
        flex: 1;
        padding: 7px 10px;
        border: 1px solid rgba(90, 72, 38, 0.22);
        border-radius: 9px;
        background: #fbf7ec;
        color: #45381f;
        font: inherit;
        font-size: 0.72rem;
        cursor: pointer;
      }

      .debug-actions button:hover {
        background: #f4edd8;
      }

      .debug-group,
      .debug-lipsync,
      .debug-emotion {
        padding-top: 12px;
      }

      .debug-group h3,
      .debug-lipsync h3,
      .debug-emotion h3 {
        margin: 0;
        color: #8a6410;
        font-size: 0.64rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .debug-emotions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        padding: 8px 0 2px;
      }

      .debug-emotions button {
        padding: 6px 4px;
        border: 1px solid rgba(90, 72, 38, 0.22);
        border-radius: 8px;
        background: #fbf7ec;
        color: #45381f;
        font: inherit;
        font-size: 0.68rem;
        cursor: pointer;
      }

      .debug-emotions button:hover {
        background: #f4edd8;
      }

      .debug-emotions button[aria-pressed='true'] {
        border-color: #8a6410;
        background: #f0dfae;
        font-weight: 650;
      }

      .debug-actions button:disabled,
      .debug-emotions button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .debug-emotion__status {
        margin: 6px 0 0;
        color: #6d6558;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.62rem;
        line-height: 1.4;
      }

      .debug-phrase-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        padding: 2px 0 4px;
      }

      .debug-phrase {
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid rgba(90, 72, 38, 0.22);
        border-radius: 8px;
        background: #fffdf8;
        color: #3f3a32;
        font: inherit;
        font-size: 0.68rem;
      }

      .debug-phrase-row button {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid rgba(90, 72, 38, 0.22);
        border-radius: 8px;
        background: #fbf7ec;
        color: #45381f;
        font: inherit;
        font-size: 0.68rem;
        white-space: nowrap;
        cursor: pointer;
      }

      .debug-phrase-row button:hover {
        background: #f4edd8;
      }

      .debug-lipsync__status {
        margin: 6px 0 0;
        color: #6d6558;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.62rem;
      }

      .debug-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 10px;
        align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid rgba(90, 72, 38, 0.08);
      }

      .debug-row__name {
        color: #3f3a32;
        font-size: 0.7rem;
      }

      .debug-row__value {
        display: flex;
        gap: 3px;
        color: #6d6558;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.62rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .debug-row__arrow {
        color: #b3a891;
      }

      .debug-row input {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
        accent-color: #8a6410;
      }

      #rig-grid,
      #viseme-grid,
      #emotion-grid {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        align-content: start;
        padding: 16px;
        overflow: auto;
        background: #f3f1ed;
      }

      #emotion-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .rig-cell {
        margin: 0;
        padding: 6px;
        border: 1px solid rgba(90, 72, 38, 0.12);
        border-radius: 12px;
        background: #fffdf8;
        box-shadow: 0 8px 18px rgba(60, 44, 18, 0.07);
      }

      .rig-cell__face {
        aspect-ratio: 1000 / 1200;
      }

      .rig-cell svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .rig-cell figcaption {
        padding-top: 2px;
        color: #5f5749;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.54rem;
        text-align: center;
      }

      @media (max-width: 1100px) {
        #rig-grid,
        #viseme-grid,
        #emotion-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        body.debug-open {
          padding-right: 20px;
        }

        #debug-panel {
          top: auto;
          left: 12px;
          right: 12px;
          bottom: 12px;
          width: auto;
          max-height: 62vh;
        }

        #rig-grid,
        #viseme-grid,
        #emotion-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
